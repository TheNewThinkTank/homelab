site_name: homelab
site_description: Reproducible Ubuntu Desktop and K3s infrastructure for the Asus PN51
repo_url: https://github.com/TheNewThinkTank/homelab
repo_name: TheNewThinkTank/homelab

nav:
  - Overview: index.md
  - Provisioning: provisioning.md
  - Architecture:
      - Hardware: PN51/README.md
      - Decisions and Diagrams: PN51/architecture-diagrams.md
  - Operations: operations.md
  - Monitoring: observability.md
  - Security:
      - Secrets and Network Boundaries: security.md
      - Guest Baseline: PN51/hardening/basic-hardening.md
      - Threat Model: PN51/hardening/hardening-overview.md
  - Reference: reference.md
  - Testing: testing.md
  - Optional GitOps: gitops.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to Dark Mode
      primary: teal
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to Light Mode
      primary: teal
      accent: lime

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/TheNewThinkTank/homelab

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
