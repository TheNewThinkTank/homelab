apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitness-tracker-argo-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TheNewThinkTank/homelab.git
    targetRevision: HEAD
    path: pn51/dev/fitness-tracker-k8s
  destination: 
    server: https://kubernetes.default.svc
    namespace: fitness-tracker

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      enabled: true
      selfHeal: true
      prune: true
