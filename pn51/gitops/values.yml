---
global:
  networkPolicy:
    create: false
    defaultDenyIngress: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault

configs:
  cm:
    admin.enabled: true
    users.anonymous.enabled: false
  params:
    server.insecure: true
  rbac:
    policy.default: role:readonly

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  networkPolicy:
    create: true

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  networkPolicy:
    create: true

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  networkPolicy:
    create: false

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  networkPolicy:
    create: true

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  networkPolicy:
    create: true

redisSecretInit:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
