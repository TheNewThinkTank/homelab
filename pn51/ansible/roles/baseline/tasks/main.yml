---
- name: Wait for cloud-init SSH access
  ansible.builtin.wait_for_connection:
    timeout: 900

- name: Wait for cloud-init to finish before touching package management
  ansible.builtin.command:
    argv: [timeout, "900", cloud-init, status, --wait]
  changed_when: false

- name: Collect guest facts
  ansible.builtin.setup:

- name: Reject unsupported or accidental bare-metal targets
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '26.04'
      - ansible_facts['architecture'] == 'x86_64'
      - ansible_facts['virtualization_role'] == 'guest'
      - ansible_facts['memtotal_mb'] >= 3500
    fail_msg: This playbook targets the Terraform-managed Ubuntu 26.04 server VMs only.

- name: Install the server guest baseline
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - openssh-server
      - ca-certificates
      - curl
      - python3-apt
      - unattended-upgrades
      - apparmor
      - nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Start the guest agent on the libvirt virtio channel
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started

- name: Keep key-based SSH available
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

- name: Install early-precedence SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      X11Forwarding no
      MaxAuthTries 3
      AllowUsers ubuntu
  notify: Reload SSH

- name: Enable security updates without surprise cluster reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Persist Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load Kubernetes kernel modules when absent
  ansible.builtin.command:
    argv: [/usr/sbin/modprobe, "{{ item }}"]
    creates: "/sys/module/{{ item }}"
  loop:
    - overlay
    - br_netfilter

- name: Reconcile Kubernetes-compatible kernel settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/90-homelab-k3s.conf
  loop: "{{ baseline_sysctls | dict2items }}"
  vars:
    baseline_sysctls:
      net.ipv4.ip_forward: "1"
      net.bridge.bridge-nf-call-iptables: "1"
      net.bridge.bridge-nf-call-ip6tables: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv4.conf.all.accept_redirects: "0"
      net.ipv4.conf.default.accept_redirects: "0"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
      net.ipv4.tcp_syncookies: "1"
      vm.overcommit_memory: "1"
      vm.panic_on_oom: "0"
      kernel.panic: "10"
      kernel.panic_on_oops: "1"
      kernel.keys.root_maxkeys: '1000000'
      kernel.keys.root_maxbytes: '25000000'

- name: Disable active swap for the kubelet
  ansible.builtin.command:
    argv: [/usr/sbin/swapoff, --all]
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Prevent fstab swap from returning at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: "^(\\s*[^#\\s]+\\s+\\S+\\s+swap\\s+.*)$"
    replace: "# \\1"

- name: Prevent cluster nodes from suspending
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Inspect the default boot target
  ansible.builtin.command:
    argv: [systemctl, get-default]
  register: baseline_boot_target
  changed_when: false

- name: Boot into the server target
  ansible.builtin.command:
    argv: [systemctl, set-default, multi-user.target]
  when: baseline_boot_target.stdout != 'multi-user.target'
  changed_when: true

- name: Inspect the Terraform-provided data disk filesystem
  ansible.builtin.command:
    argv: [blkid, -s, TYPE, -o, value, "{{ homelab_data_device }}"]
  register: baseline_data_type
  changed_when: false
  failed_when: baseline_data_type.rc not in [0, 2]

- name: Refuse to overwrite an existing non-ext4 data disk
  ansible.builtin.assert:
    that:
      - baseline_data_type.stdout in ['', 'ext4']
      - homelab_data_device == '/dev/vdb'
      - homelab_data_mount == '/srv/homelab-data'
    fail_msg: Only the separate Terraform-managed blank or ext4 data disk may be used.

- name: Inspect signatures before formatting an apparently blank data disk
  ansible.builtin.command:
    argv: [wipefs, --json, "{{ homelab_data_device }}"]
  register: baseline_data_signatures
  when: baseline_data_type.stdout == ''
  changed_when: false

- name: Refuse to format an unrecognized partitioned or signed disk
  ansible.builtin.assert:
    that:
      - (baseline_data_signatures.stdout | from_json).signatures | length == 0
    fail_msg: The data disk contains existing signatures; inspect it instead of formatting it.
  when: baseline_data_type.stdout == ''

- name: Format a new blank data disk without touching retained filesystems
  ansible.builtin.command:
    argv: [mkfs.ext4, -L, homelab-data, "{{ homelab_data_device }}"]
  when: baseline_data_type.stdout == ''
  changed_when: true

- name: Mount the protected application data disk persistently
  ansible.posix.mount:
    path: "{{ homelab_data_mount }}"
    src: "{{ homelab_data_device }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Create the persistent local-path storage root
  ansible.builtin.file:
    path: "{{ homelab_data_mount }}/storage"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Create the guest firewall configuration directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: '0755'

- name: Reconcile a dedicated default-deny guest input firewall
  ansible.builtin.copy:
    dest: /etc/nftables.d/homelab.nft
    mode: '0600'
    content: |
      add table inet homelab
      flush table inet homelab
      table inet homelab {
        chain input {
          type filter hook input priority 0; policy drop;
          iifname "lo" accept
          ct state established,related accept
          ct state invalid drop
          ip protocol icmp accept
          meta l4proto ipv6-icmp accept
          ip saddr {{ k3s_nat_gateway }} tcp dport { 22, 80, 443, 6443 } accept
          ip saddr {{ k3s_node_cidr }} tcp dport { 80, 443, 6443, 10250 } accept
          ip saddr {{ k3s_node_cidr }} udp dport 8472 accept
          ip saddr {{ k3s_pod_cidr }} tcp dport { 6443, 10250 } accept
        }
      }
  notify: Reload guest firewall

- name: Reconcile the dedicated guest firewall service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-firewall.service
    mode: '0644'
    content: |
      [Unit]
      Description=Homelab guest input firewall
      Before=k3s.service k3s-agent.service
      After=network-pre.target
      Wants=network-pre.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/homelab.nft
      ExecReload=/usr/sbin/nft -f /etc/nftables.d/homelab.nft
      [Install]
      WantedBy=multi-user.target
  notify: Reload guest firewall

- name: Enable the guest firewall without flushing Kubernetes networking rules
  ansible.builtin.systemd_service:
    name: homelab-firewall
    enabled: true
    state: started
    daemon_reload: true
