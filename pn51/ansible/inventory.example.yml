---
all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
    cluster_name: pn51
    k3s_pod_cidr: 10.42.0.0/16
    k3s_service_cidr: 10.43.0.0/16
    k3s_cluster_dns: 10.43.0.10
    k3s_api_service_ip: 10.43.0.1
    k3s_node_cidr: 10.51.0.0/24
    k3s_nat_gateway: 10.51.0.1
    pn51_host_ssh_alias: pn51
    homelab_data_device: /dev/vdb
    homelab_data_mount: /srv/homelab-data
  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            pn51-server-1:
              ansible_host: 10.51.0.40
              libvirt_name: pn51-server-1
              libvirt_mac: "52:54:00:51:00:28"
        k3s_agents:
          hosts:
            pn51-worker-1:
              ansible_host: 10.51.0.41
              libvirt_name: pn51-worker-1
              libvirt_mac: "52:54:00:51:00:29"
            pn51-worker-2:
              ansible_host: 10.51.0.42
              libvirt_name: pn51-worker-2
              libvirt_mac: "52:54:00:51:00:2a"
            pn51-worker-3:
              ansible_host: 10.51.0.43
              libvirt_name: pn51-worker-3
              libvirt_mac: "52:54:00:51:00:2b"
