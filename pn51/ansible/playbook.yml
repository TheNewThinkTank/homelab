---
- name: Prepare four Ubuntu Desktop guests
  hosts: k3s_cluster
  gather_facts: false
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Validate the intended cluster topology and pinned release
      ansible.builtin.assert:
        that:
          - groups['k3s_cluster'] | length == 4
          - groups['k3s_server'] | length == 1
          - groups['k3s_agents'] | length == 3
          - groups['k3s_cluster'] | map('extract', hostvars, 'ansible_host') | unique | length == 4
          - k3s_version is match('^v1\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
          - k3s_binary_checksum is match('^sha256:[a-f0-9]{64}$')
        fail_msg: Use the generated four-node inventory and a pinned K3s release.

    - name: Validate vaulted credentials without disclosing them
      ansible.builtin.assert:
        that:
          - k3s_token is defined
          - k3s_token is match('^[a-f0-9]{64}$')
          - grafana_admin_password is defined
          - grafana_admin_password | length >= 24
        fail_msg: Supply the encrypted vault with a 64-character hex K3s token and a long Grafana password.
      no_log: true

  roles:
    - role: baseline
    - role: dotfiles
      when: dotfiles_enabled | default(false) | bool

- name: Configure the single K3s control plane
  hosts: k3s_server
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: k3s
      vars:
        k3s_role: server
  post_tasks:
    - name: Export a private administrator kubeconfig
      ansible.builtin.import_tasks: tasks/kubeconfig.yml

- name: Configure K3s workers one at a time
  hosts: k3s_agents
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - role: k3s
      vars:
        k3s_role: agent

- name: Install Prometheus, Alertmanager, and Grafana
  hosts: k3s_server
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: monitoring
