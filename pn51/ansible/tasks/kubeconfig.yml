---
- name: Read the administrator kubeconfig without exposing credentials
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_source
  no_log: true

- name: Parse the kubeconfig as structured YAML
  ansible.builtin.set_fact:
    kubeconfig_document: "{{ kubeconfig_source.content | b64decode | from_yaml }}"
    cacheable: false
  no_log: true

- name: Create the private controller workspace
  ansible.builtin.file:
    path: "{{ kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write a private kubeconfig with the externally reachable TLS endpoint
  ansible.builtin.copy:
    dest: "{{ kubeconfig_local_path }}"
    mode: "0600"
    content: >-
      {{ kubeconfig_document | combine({'clusters': [
        kubeconfig_document['clusters'][0] | combine({'cluster':
          kubeconfig_document['clusters'][0]['cluster'] | combine({
            'server': 'https://' ~ ansible_host ~ ':6443'
          })
        })
      ]}) | to_nice_yaml }}
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
