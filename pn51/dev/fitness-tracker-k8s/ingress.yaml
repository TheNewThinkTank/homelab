apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
    stsSeconds: 86400
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
spec:
  forwardAuth:
    address: http://authelia.platform.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: false
    authResponseHeaders: [Remote-User, Remote-Groups, Remote-Name, Remote-Email]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitness-tracker
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: fitness-tracker-security-headers@kubernetescrd,fitness-tracker-authelia@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [fitness.pn51.192.168.1.20.sslip.io]
      secretName: homelab-tls
  rules:
    - host: fitness.pn51.192.168.1.20.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitness-tracker
                port:
                  number: 8080
