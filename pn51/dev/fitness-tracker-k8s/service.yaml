apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: fitness-tracker
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-tracker
spec:
  selector:
    app.kubernetes.io/name: fitness-tracker
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
