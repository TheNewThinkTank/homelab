# DO NOT commit real values. Fill in base64-encoded values and apply manually,
# or use an external secret manager (Sealed Secrets, External Secrets Operator, etc.)
#
# Encode a value:  echo -n "your_value" | base64
# Decode a value:  echo "encoded" | base64 --decode
#
# For credentials.json, encode the entire file:
#   base64 -i local_assets/credentials.json
apiVersion: v1
kind: Secret
metadata:
  name: fitness-tracker-secret
  namespace: default
type: Opaque
data:
  EMAIL: ""                  # echo -n "you@example.com" | base64
  CREDENTIALS_JSON: ""       # base64 -i local_assets/credentials.json
