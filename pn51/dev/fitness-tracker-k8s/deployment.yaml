apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker-backend
  annotations:
    org.opencontainers.image.revision: e2af8408f0a1321d546fe014857dc6e4a0e4cb82
  labels:
    app.kubernetes.io/name: fitness-tracker
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fitness-tracker
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitness-tracker
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: fitness-tracker-state
        - name: imported-data
          emptyDir:
            sizeLimit: 64Mi
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: backend
          image: ghcr.io/thenewthinktank/fitness-tracker@sha256:cafeb085826d452d089edf9f5b27842ce30e5f3721046469d3069d7ed4348b26
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fitness-tracker-config
            - secretRef:
                name: fitness-tracker-runtime
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: state
              mountPath: /state
            - name: imported-data
              mountPath: /data
              readOnly: true
            - name: temporary
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker-frontend
  annotations:
    org.opencontainers.image.revision: e2af8408f0a1321d546fe014857dc6e4a0e4cb82
  labels:
    app.kubernetes.io/name: fitness-tracker
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fitness-tracker
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitness-tracker
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/thenewthinktank/fitness-tracker-frontend@sha256:6aaadd0d8bb37e2b4c874154f80253b9c808ce77741ab75fab783bba0525d4f6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FITNESS_TRACKER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fitness-tracker-runtime
                  key: FITNESS_TRACKER_API_TOKEN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
