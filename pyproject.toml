[project]
name = "homelab"
version = "0.0.1"
description = "Reproducible four-VM Ubuntu Desktop and K3s homelab on Proxmox"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.11,<10",
]

[dependency-groups]
dev = [
    "ansible-core==2.20.6",
    "ansible-lint>=26.1,<27",
    "kubernetes>=35,<39",
    "pyyaml>=6.0.3,<7",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "ruamel-yaml>=0.18,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
