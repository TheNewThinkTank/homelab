[defaults]
inventory = .local/inventory.json
roles_path = pn51/ansible/roles
collections_path = .local/collections
local_tmp = .local/ansible/tmp
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
forks = 4
timeout = 30
display_args_to_stdout = False

[ssh_connection]
pipelining = True
control_path_dir = .local/ansible/cp
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UpdateHostKeys=no
